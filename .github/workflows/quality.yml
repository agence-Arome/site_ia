name: Qualité WordPress
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Installer les outils verrouillés
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Vérifier la syntaxe PHP
        run: find wp-content tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress Coding Standards
        run: composer lint
